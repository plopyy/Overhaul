# Réglages des armes / Weapon settings. Redémarrer après modification / Restart after editing.
# Speed : 1 = vanilla, 1.5 = +50 %. BackstabBonus : multiplicateur total, pas un bonus ajouté.
# FirstAttackMovement : déplacement ajouté par Overhaul au premier coup uniquement ; true/false.
# Les attaques de tir/lancer ne reçoivent pas de déplacement de mêlée. Valeurs serveur synchronisées.

# FR : Épées à une main
# EN : One-handed swords
# Exemples / Examples : Épée en sombracier / Black Metal Sword (SwordBlackmetal); Épée en bronze / Bronze Sword (SwordBronze); Cheat sword / Cheat sword (SwordCheat)
# Sournoise vanilla / Native backstab : x3
[Swords1H]
LightAttackSpeed = 1.5
HeavyAttackSpeed = 1
BackstabBonus = 3
LightFirstAttackMovement = true
HeavyFirstAttackMovement = true

