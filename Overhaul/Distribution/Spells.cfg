# Grimoire spells (SpellSystem). The server's file is the reference, sent to every player.
# Name / Description: translation keys (translationsFR/EN.json).
# Element: Fire, Ice or Lightning. Type: Normal, Special or Shield (grimoire slot). Tier: 1 to 3 (grimoire column; a spell's rank, its pips, is its own).
# Level: class level that unlocks the spell, 0 = known from the start.
# Power: damage in % of the staff's magic power, dealt in the spell's element (only the magic power is converted).
# Eitr: eitr cost of a cast.
# Icon: grimoire icon (Icon_<Icon> sprite of the grimoire bundle).
# Attack: game staff whose attack is cast (animation, timing, projectile).
# Projectile: game staff whose projectile replaces the attack's own (empty = the attack's). ProjectileScale: its size (1 = as is).
# ProjectileSpeed: speed multiplier of the projectile (1 = as is). ProjectileGravity: its gravity (0 = flies straight at the
# crosshair, empty = its own).
# SlowPercent / SlowDuration: slows the creatures hit (movement and attack speed) by this % for this many seconds.
# StunChance / StunDuration: % chance to stun each creature hit (no move, no attack) for this many seconds.
# Cast: Projectile (default: the attack's projectile) or Nova (an 8 m ice nova around the caster, hitting every enemy in it
# at once; the attack only plays its animation).
# FreezeDuration: freezes each creature hit for this many seconds (no move, no attack, in an ice block, no damage of its
# own, a new hit restarts it); FrozenRocks.cfg spares some creatures. The ice nova lasts about 3 s: 6 = 3 s after it.
# The projectile size is read when the game starts: a change needs a restart.

