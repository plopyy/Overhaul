# Recompenses des coffres de boss de donjon Overhaul.
# Format : nom interne du prefab = quantite minimale, quantite maximale, chance en %
# Exemple : Ruby = 1, 3, 50  -> 50% de chance d'obtenir entre 1 et 3 rubis.
# Chance facultative : 100% si omise. Chaque ligne est tiree independamment.
# Pour retirer un objet, supprimer sa ligne ou mettre sa chance a 0.
# Quantites entieres 0..10000, minimum <= maximum. Decimales de chance avec un point.
# Conserver les quatre sections ; une section vide donne un coffre vide.
# Maximum 64 objets differents et 512 piles par coffre.
# Lu au demarrage. Modifier sur le serveur (ou en solo), puis redemarrer.
# Uniquement les nouveaux coffres / donjons regeneres : aucun coffre existant n'est rempli a nouveau.

