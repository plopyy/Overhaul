# =======================
# === Enchanting table ===
# =======================
# Enchanting: the item and one mob trophy are put on the table; the trophy is used up and the item's rarity and lines are
# drawn again with the odds of the trophy's tier. A normal creature gives the tier of its biome (biome order of the Biome
# sections, Meadows = 1), captains and elites one tier more, bosses two more (biome and rank from MonsterCategories.cfg).
# Changing a line: the first line changed is the only one that can be changed again on that item; each try costs RerollCost
# (taken from the player's inventory, then the chests around the table) and offers the current line plus two other effects.

[EnchantTable]
RerollCost = BoneFragments:5, Resin:5
CaptainTiers = 1
EliteTiers = 1
BossTiers = 2

# Odds of each rarity, in the order of the Rarity sections (Common first: always 0, an enchanted item has lines).
