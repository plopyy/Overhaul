# ==================
# === Biome loot ===
# ==================
# Every creature of MonsterCategories.cfg may drop one gear item of its biome's list (Biome sections above). The odds come
# from its rank only, never from the biome: a normal Black Forest creature finds a legendary as often as a normal Ashlands one.
# A biome boss drops an item of the next biome; the boss of the last biome uses FinalBoss and drops from its own biome.
# Dungeon guardians drop no gear: their chest always holds one item of the dungeon's biome, drawn with the Chest odds.
# Tamed creatures drop nothing. LootChance in percent, Rarity = weights in the order of the Rarity sections (Common first).

[BiomeLoot_Normal]
LootChance = 3
Quantity = 1
Rarity = [62, 24, 9, 3.5, 1.2, 0.27, 0.03]

[BiomeLoot_Captain]
LootChance = 12
Quantity = 1
Rarity = [42, 30, 16, 8, 3, 0.85, 0.15]

[BiomeLoot_Elite]
LootChance = 25
Quantity = 1
Rarity = [28, 30, 22, 12, 5.5, 2, 0.5]

[BiomeLoot_Chest]
LootChance = 100
Quantity = 1
Rarity = [12, 26, 27, 19, 10.5, 4.3, 1.2]

[BiomeLoot_Boss]
LootChance = 100
Quantity = 1
Rarity = [0, 15, 26, 28, 18, 10, 3]

[BiomeLoot_FinalBoss]
LootChance = 100
Quantity = 1
Rarity = [0, 0, 14, 30, 30, 20, 6]

# Gear of the Biome lists that the biome loot (creatures, bosses and guardian chests) never drops, by prefab name, comma
