# =================
# === Catalysts ===
# =================
# Items used as catalysts: they always have the Catalyst rarity (no enchantment lines, no catalyst slots, never enchanted).
# Effect: what the catalyst does once socketed in equipped gear (the same catalyst counts once, whatever the gear):
#   FirstStrike (Value % more damage on a creature at full health), ThunderStrike (every Count attacks, a bolt deals Damage lightning),
#   DesperateLifeSteal (under Threshold % health, Value % life steal), FireThorns (melee attackers take Damage fire),
#   LastStand (under Threshold % health, the next hit taken is cancelled, once every Cooldown s), Entangle (Chance % to root the target Duration s),
#   ParryReflect (a parry sends back Value % of the parried damage), ColdWalker (Value % faster in the Mountains and Deep North; in an armour piece or shield, each hit taken has NovaChance % to set off a frost nova of NovaDamage within NovaRadius m; in a weapon, an ice shard forms every ShardEvery s, up to ShardMax, and each attack sends them all at random enemies for ShardDamage frost damage, split by the extra projectiles),
#   Execute (Value % more damage on a creature under Threshold % health), KillExplosion (a kill sets off a fire burst of Damage),
#   EitrSurge (each spell: Chance % to refill all eitr), KillFrenzy (each kill: Value % more damage for Duration s, up to Stacks),
#   HighJump (Value % higher jumps), LavaWalker (no lava or hot water damage; in a weapon, each hit has WeakChance % to put a fire weakness of WeakValue % less fire resistance per stack, up to WeakStacks, for WeakDuration s, restarted by each stack), DotEvery (every Count attacks, hit or not, puts Dot with Damage base),
#   PreciousLoot (each grown tree felled, rock, ore vein or mud pile broken: Chance % to drop Min to Max items, each one drawn among Items),
#   Lightning (each weapon hit: Chance % that a bolt strikes what was hit for Damage lightning; socketed in an axe +Chop chop, in a pickaxe +Mine mining).
# Bonus: effects of Effects.cfg the catalyst adds while worn (id:value, comma separated).

[Catalyst_AmberPearl]
Effect = PreciousLoot
Chance = 15
Min = 1
Max = 3
Items = Ruby, AmberPearl, Amber

[Catalyst_Ruby]
Effect = DesperateLifeSteal
Threshold = 30
Value = 5

[Catalyst_SurtlingCore]
