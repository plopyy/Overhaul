# CONFIGURATION DES COMPORTEMENTS DES CREATURES
# Classement : biome, puis Normal / Captain / Elite / Boss, selon MonsterCategories.cfg.
# Les créatures absentes de ce classement restent regroupées à la fin.
# Une section [Prefab] par créature. Les variables et leurs valeurs sont en anglais.
# Les réglages se combinent. Redémarrer après modification ; valeurs du serveur synchronisées aux clients.
# DumbChance : 0 pour Deathsquito, 15 pour Greyling, 7 pour les autres sections.
#
# Aggressiveness (choix) : normal | vanilla | aggressive | cunning
#   normal / vanilla : comportement natif du jeu.
#   aggressive : approche directe ; supprime les déplacements circulaires et le contournement individuel.
#     En pack, les membres encerclent la cible avant un assaut commun.
#   cunning : cherche un passage vers l'arrière ou le côté de la cible pendant 2,5 secondes,
#     puis approche directement pendant 3 secondes. Si le passage est impossible, reprend l'approche native.
#
# Intelligence (choix) : normal | vanilla | dumb | smart
#   vanilla : perception et réactions natives du jeu, sans défense ajoutée.
#   normal : perception native ; 35 % de chance de tenter une défense au début d'une attaque adverse à moins de 6 m.
#   dumb : distances de vision, d'audition et d'alerte réduites de 40 % ; aucun délai de réaction ajouté.
#     Aucune alerte de combat ni réaction à la présence, aux projectiles ratés ou aux alliés attaqués.
#     Ne bloque ni n’esquive, ne contourne pas et n'attaque pas en premier. Riposte uniquement à celui qui lui inflige des dégâts.
#     Ces restrictions priment sur cunning, helper et pack ; ne participe pas à l'encerclement.
#     20 % des attaques sont suivies d'un coup au meme endroit, sans suivre la cible.
#     A la mort de sa cible, donne encore 1 a 2 coups a cet endroit, puis redevient passif.
#     Coups supplementaires soumis aux animations et a la cadence ; abandon apres 30 s.
#   smart : peut attaquer sans attendre sa cadence habituelle dans les 1,2 secondes suivant un coup de mêlée raté du joueur.
#     À chaque début d'attaque adverse observé à moins de 6 m, a 80 % de chance de tenter une défense.
#   Défense (normal et smart) : bloque pendant 1,2 seconde si équipement et animation permettent le blocage.
#     Sinon, esquive vers l'arrière pendant 0,45 seconde à 1,5 fois sa vitesse de course.
#     Utilise son animation d'esquive si disponible, sinon un déplacement rapide vers l'arrière.
#     Recule par les déplacements physiques natifs, seulement si le chemin est accessible et dégagé.
#     Si l'arriere est bloque, essaie un cote libre ; si les trois directions sont bloquees, reste sur place.
#     Aucun bonus d'invulnérabilité ; blocage ou évitement réussi non garanti.
#
# DumbChance (nombre de 0 à 100) : pourcentage de chance de remplacer Intelligence par dumb à l'apparition.
#   0 : aucun remplacement ; 10 : environ un mob sur dix ; 100 : tous les mobs concernés sont dumb.
#   Le résultat est enregistré sur l'entité : pas de nouveau tirage au chargement ou au changement de propriétaire réseau.
#   Une modification du CFG ne change pas l'intelligence des mobs déjà initialisés.
#   Les anciennes entités sans valeur enregistrée sont initialisées une seule fois à leur prochain chargement.
#   Seuls les boss de biome sont exclus de ce fichier, sans icone ni tirage.
#   Les gardiens de donjon suivent le profil de leur creature, mais sont toujours smart (DumbChance ignore).
#   Etoiles : 1 etoile donne 20 % de chance de promotion smart, 2 etoiles ou plus donnent 50 %.
#     Un seul tirage enregistre sur l'entite ; les etoiles attribuees apres l'apparition sont prises en compte.
#     Dumb reste prioritaire et smart reste smart. Exemple : 2 etoiles et DumbChance = 7 donnent
#     environ 7 % dumb, 46,5 % smart et 46,5 % du profil de base si celui-ci est normal.
#
# GroupBehavior (choix) : normal | vanilla | helper | pack
#   normal / vanilla : comportement de groupe natif du jeu.
#   helper : s'il n'a pas de cible, vérifie toutes les 0,5 seconde les alliés attaqués à moins de 30 m.
#     Si un chemin vers l'allié existe, prend son agresseur pour cible.
#   pack : nécessite au moins 3 alliés non dumb configurés en pack, visant la même cible à moins de 20 m.
#     Les membres prennent des positions distinctes autour de la proie. Au moins deux membres prêts,
#     séparés d'au moins 60 degrés, déclenchent une fenêtre d'assaut commune de 2 secondes.
#     Plusieurs membres peuvent attaquer ensemble ; animations, portée et cadence restent natives.
#     Après 4 secondes sans placement suffisant, un assaut permet de reprendre la poursuite malgré le terrain.
#     En dessous de 3 membres, le comportement de groupe redevient natif.
#   Alliés : mutuellement non hostiles et de même faction, de même groupe explicite ou tous deux apprivoisés.
#
# Charge (booléen) : true | false
#   false : désactive la charge ajoutée par Overhaul ; les autres réglages restent applicables.
#   true : à partir de 10 m d'une cible visible, court directement vers elle et attaque dès qu'elle est à portée,
#     sans attendre les délais de cadence de l'IA. Conserve vitesse de course, collision, orientation et animation natives.
#     En pack, démarre pendant l'assaut commun. S'interrompt en cas de perte de visibilité ou d'interruption du mob ; abandonne après 8 s.
#     Lox utilise le coup de tête (lox_bite), jamais l'écrasement pour terminer cette charge.
#
# Deathsquito : mouvement circulaire natif entre les piqûres, cadence de 5 s au lieu de 10 s.
#   Chaque piqûre ignore 50 % de l'armure ; le blocage et les résistances gardent leur calcul natif.
# Camps gobelins : une detection ou une attaque alerte tous les gobelins non dumb du camp.
#   Une seule corne lors du passage calme -> combat, sans repetition pendant les renforts ou les degats.
#   Nouvelle corne seulement apres retour de tout le camp au calme, avec une marge reseau de 5 s.
#
# Les contrôles natifs de sommeil, fuite, monture et alimentation restent prioritaires.
# Les animaux sans attaques conservent leur fuite ; dumb réduit leur perception sans retarder leur réaction.
# Les oiseaux décoratifs n'ont pas de tactiques offensives.

