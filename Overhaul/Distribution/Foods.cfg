# Foods (EitrFoods). The server's file is the reference, sent to every player.
# [Settings] EitrPercent: eitr given by every food that has none of its own, in % of its health + stamina.
# [Food_<Id>] sections: eitr-oriented dishes, one per biome from the Black Forest to the Plains, leading to the
# Mistlands' eitr dishes (stuffed mushroom: 75 eitr).
#   Name / Description: translation keys (translationsFR/EN.json).
#   Model: game dish whose model and icon (tinted eitr blue) the dish uses.
#   Station / StationLevel: crafting station and its level. Ingredients: prefab:amount, ... Amount: dishes made.
#   Health / Stamina / Eitr / Duration (seconds) / Regen: the dish's food values.
# The recipes (station, ingredients, amount) are read when the game starts: a change needs a restart.

