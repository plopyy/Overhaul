# Class skill tree. Sections: ClassId.SkillId (stable, case-sensitive IDs).
# Name/Description: translation keys, with or without a leading $.
# Tier: column from left to right, starting at 1. File order sets row order.
# MaxRank: skill points needed to fully upgrade; each rank costs one point.
# RequiredLevel: exactly one class level per rank, e.g. [4,6,8].
# RequiredSkill: all listed skills of this class must have at least rank 1.
# Use [] for no prerequisite. Prerequisites must belong to an earlier tier.
# Reopen the class window to reload edits. Invalid edits keep the last valid tree.

