# Dungeon-room guardians only. Read at startup; applies to newly spawned guardians.
# Stars: 0..3. HealthBonusPercent: 100 means +100% final HP (x2).
# Scale: final size multiplier; 1 keeps the normal final size, 1.5 means x1.5.
# AttackSpeed: attack animation and cooldown multiplier, 0.1..10; 2 doubles attack speed.
# Saved guardians retain their own values; older guardians acquire AttackSpeed on first use.
# Ordinary creatures are never affected.

